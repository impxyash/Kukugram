name: Feed PostgreSQL Performance

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: feed-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'run-feed-benchmark') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kukugram_bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kukugram_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kukugram_bench
    steps:
      - uses: actions/checkout@v4
      - name: Wait for isolated PostgreSQL
        run: |
          for attempt in {1..30}; do
            if pg_isready -d "$PGDATABASE"; then exit 0; fi
            sleep 2
          done
          echo "Disposable benchmark PostgreSQL did not become ready." >&2
          exit 1

      - name: Apply repository migrations
        run: |
          set -euo pipefail
          for migration in packages/database/drizzle/[0-9]*.sql; do
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Reset pagination indexes for disposable baseline
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "DROP INDEX IF EXISTS content.posts_feed_global_cursor"
          psql -X -v ON_ERROR_STOP=1 -c "DROP INDEX IF EXISTS notifications.notifications_recipient_cursor"

      - name: Seed disposable benchmark dataset
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO identity.users (id, email)
          SELECT md5('kukugram-bench-user-' || n)::uuid,
                 'bench-user-' || n || '@example.invalid'
          FROM generate_series(1, 12000) AS n;

          INSERT INTO social.profiles (user_id, handle, display_name, privacy)
          SELECT md5('kukugram-bench-user-' || n)::uuid,
                 'bench_' || n,
                 'Benchmark User ' || n,
                 CASE WHEN n % 20 = 0 THEN 'private' ELSE 'public' END
          FROM generate_series(1, 12000) AS n;

          INSERT INTO social.follows (follower_id, followee_id, status)
          SELECT md5('kukugram-bench-user-1')::uuid,
                 md5('kukugram-bench-user-' || n)::uuid,
                 CASE WHEN n % 5 = 0 THEN 'pending' ELSE 'accepted' END
          FROM generate_series(2, 661) AS n;

          INSERT INTO social.mutes (muter_id, muted_id)
          SELECT md5('kukugram-bench-user-1')::uuid,
                 md5('kukugram-bench-user-' || n)::uuid
          FROM generate_series(602, 631) AS n;

          INSERT INTO social.blocks (blocker_id, blocked_id)
          SELECT md5('kukugram-bench-user-1')::uuid,
                 md5('kukugram-bench-user-' || n)::uuid
          FROM generate_series(632, 646) AS n;

          INSERT INTO social.blocks (blocker_id, blocked_id)
          SELECT md5('kukugram-bench-user-' || n)::uuid,
                 md5('kukugram-bench-user-1')::uuid
          FROM generate_series(647, 661) AS n;

          INSERT INTO content.posts (id, author_id, body, created_at, deleted_at)
          SELECT md5('kukugram-bench-post-' || n)::uuid,
                 md5('kukugram-bench-user-' || (mod(n * 37, 12000) + 1))::uuid,
                 'Synthetic feed benchmark post ' || n,
                 now() - (mod(n, 129600)::text || ' minutes')::interval,
                 CASE WHEN n % 33 = 0 THEN now() ELSE NULL END
          FROM generate_series(1, 400000) AS n;

          INSERT INTO content.likes (user_id, post_id)
          SELECT md5('kukugram-bench-user-' || (mod(n * 13, 12000) + 1))::uuid,
                 md5('kukugram-bench-post-' || n)::uuid
          FROM generate_series(1, 120000) AS n;

          INSERT INTO content.comments (id, post_id, author_id, body)
          SELECT md5('kukugram-bench-comment-' || n)::uuid,
                 md5('kukugram-bench-post-' || n)::uuid,
                 md5('kukugram-bench-user-' || (mod(n * 17, 12000) + 1))::uuid,
                 'Synthetic benchmark comment ' || n
          FROM generate_series(1, 80000) AS n;

          ANALYZE identity.users;
          ANALYZE social.profiles;
          ANALYZE social.follows;
          ANALYZE social.mutes;
          ANALYZE social.blocks;
          ANALYZE content.posts;
          ANALYZE content.likes;
          ANALYZE content.comments;
          SQL

          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO social.follows (follower_id, followee_id, status)
          SELECT md5('kukugram-bench-user-2')::uuid,
                 md5('kukugram-bench-user-' || n)::uuid,
                 'accepted'
          FROM generate_series(100, 104) AS n;

          INSERT INTO social.follows (follower_id, followee_id, status)
          SELECT md5('kukugram-bench-user-3')::uuid,
                 md5('kukugram-bench-user-' || n)::uuid,
                 'accepted'
          FROM generate_series(1001, 6000) AS n;

          INSERT INTO notifications.notifications (id, recipient_id, actor_id, type, created_at, read_at)
          SELECT md5('kukugram-bench-notification-' || n)::uuid,
                 md5('kukugram-bench-user-' || (mod(n * 29, 12000) + 1))::uuid,
                 CASE
                   WHEN n % 10 = 0 THEN NULL
                   ELSE md5('kukugram-bench-user-' || (mod(n * 17, 12000) + 1))::uuid
                 END,
                 'follow',
                 now() - (mod(n, 129600)::text || ' minutes')::interval,
                 CASE WHEN (n / 12000) % 10 < 7 THEN now() ELSE NULL END
          FROM generate_series(1, 1200000) AS n;

          ANALYZE social.follows;
          ANALYZE notifications.notifications;
          SQL

      - name: Capture actual feed query plans
        run: |
          set -euo pipefail
          mkdir -p artifacts
          psql -X -q -A -t -v ON_ERROR_STOP=1 > artifacts/feed-first-page-baseline-plan.json <<'SQL'
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT p.id, p.body, p.created_at AS "createdAt",
                 pr.handle, pr.display_name AS "displayName",
                 pr.avatar_url AS "avatarUrl",
                 (SELECT count(*) FROM content.likes l WHERE l.post_id = p.id) AS "likeCount",
                 (SELECT count(*) FROM content.comments c WHERE c.post_id = p.id) AS "commentCount",
                 EXISTS(SELECT 1 FROM content.likes l WHERE l.post_id = p.id
                        AND l.user_id = md5('kukugram-bench-user-1')::uuid) AS "likedByViewer",
                 p.author_id AS "authorId"
          FROM content.posts p
          JOIN social.profiles pr ON pr.user_id = p.author_id
          WHERE p.deleted_at IS NULL
            AND (p.author_id = md5('kukugram-bench-user-1')::uuid
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('kukugram-bench-user-1')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND NOT EXISTS(SELECT 1 FROM social.mutes m
                           WHERE m.muter_id = md5('kukugram-bench-user-1')::uuid
                             AND m.muted_id = p.author_id)
            AND NOT EXISTS(SELECT 1 FROM social.blocks b
                           WHERE (b.blocker_id = p.author_id
                                  AND b.blocked_id = md5('kukugram-bench-user-1')::uuid)
                              OR (b.blocker_id = md5('kukugram-bench-user-1')::uuid
                                  AND b.blocked_id = p.author_id))
            AND (p.author_id = md5('kukugram-bench-user-1')::uuid
                 OR EXISTS(SELECT 1 FROM social.profiles public_profile
                           WHERE public_profile.user_id = p.author_id
                             AND public_profile.privacy <> 'private')
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('kukugram-bench-user-1')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND (NULL::timestamptz IS NULL
                 OR (p.created_at, p.id) <
                    (NULL::timestamptz, NULL::uuid))
          ORDER BY p.created_at DESC, p.id DESC
          LIMIT 51;
          SQL

          psql -X -q -A -t -v ON_ERROR_STOP=1 > artifacts/feed-cursor-page-baseline-plan.json <<'SQL'
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT p.id, p.body, p.created_at AS "createdAt",
                 pr.handle, pr.display_name AS "displayName",
                 pr.avatar_url AS "avatarUrl",
                 (SELECT count(*) FROM content.likes l WHERE l.post_id = p.id) AS "likeCount",
                 (SELECT count(*) FROM content.comments c WHERE c.post_id = p.id) AS "commentCount",
                 EXISTS(SELECT 1 FROM content.likes l WHERE l.post_id = p.id
                        AND l.user_id = md5('kukugram-bench-user-1')::uuid) AS "likedByViewer",
                 p.author_id AS "authorId"
          FROM content.posts p
          JOIN social.profiles pr ON pr.user_id = p.author_id
          WHERE p.deleted_at IS NULL
            AND (p.author_id = md5('kukugram-bench-user-1')::uuid
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('kukugram-bench-user-1')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND NOT EXISTS(SELECT 1 FROM social.mutes m
                           WHERE m.muter_id = md5('kukugram-bench-user-1')::uuid
                             AND m.muted_id = p.author_id)
            AND NOT EXISTS(SELECT 1 FROM social.blocks b
                           WHERE (b.blocker_id = p.author_id
                                  AND b.blocked_id = md5('kukugram-bench-user-1')::uuid)
                              OR (b.blocker_id = md5('kukugram-bench-user-1')::uuid
                                  AND b.blocked_id = p.author_id))
            AND (p.author_id = md5('kukugram-bench-user-1')::uuid
                 OR EXISTS(SELECT 1 FROM social.profiles public_profile
                           WHERE public_profile.user_id = p.author_id
                             AND public_profile.privacy <> 'private')
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('kukugram-bench-user-1')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND (p.created_at, p.id) <
                (now() - interval '45 days',
                 md5('kukugram-bench-post-200000')::uuid)
          ORDER BY p.created_at DESC, p.id DESC
          LIMIT 51;
          SQL

      - name: Capture sparse and high-follow baseline plans
        run: |
          set -euo pipefail
          for cohort in sparse high; do
            if [[ "$cohort" == "sparse" ]]; then viewer="kukugram-bench-user-2"; else viewer="kukugram-bench-user-3"; fi
            for page in first cursor; do
              if [[ "$page" == "first" ]]; then cursor_predicate="TRUE"; else cursor_predicate="(p.created_at, p.id) < (now() - interval '45 days', md5('kukugram-bench-post-200000')::uuid)"; fi
              psql -X -q -A -t -v ON_ERROR_STOP=1 > "artifacts/feed-${cohort}-${page}-baseline-plan.json" <<SQL
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT p.id, p.body, p.created_at AS "createdAt",
                 pr.handle, pr.display_name AS "displayName",
                 pr.avatar_url AS "avatarUrl",
                 (SELECT count(*) FROM content.likes l WHERE l.post_id = p.id) AS "likeCount",
                 (SELECT count(*) FROM content.comments c WHERE c.post_id = p.id) AS "commentCount",
                 EXISTS(SELECT 1 FROM content.likes l WHERE l.post_id = p.id
                        AND l.user_id = md5('${viewer}')::uuid) AS "likedByViewer",
                 p.author_id AS "authorId"
          FROM content.posts p
          JOIN social.profiles pr ON pr.user_id = p.author_id
          WHERE p.deleted_at IS NULL
            AND (p.author_id = md5('${viewer}')::uuid OR EXISTS (
              SELECT 1 FROM social.follows f
              WHERE f.follower_id = md5('${viewer}')::uuid
                AND f.followee_id = p.author_id AND f.status = 'accepted'
            ))
            AND NOT EXISTS(SELECT 1 FROM social.mutes m
                           WHERE m.muter_id = md5('${viewer}')::uuid
                             AND m.muted_id = p.author_id)
            AND NOT EXISTS(SELECT 1 FROM social.blocks b
                           WHERE (b.blocker_id = p.author_id AND b.blocked_id = md5('${viewer}')::uuid)
                              OR (b.blocker_id = md5('${viewer}')::uuid AND b.blocked_id = p.author_id))
            AND (p.author_id = md5('${viewer}')::uuid
                 OR EXISTS(SELECT 1 FROM social.profiles public_profile
                           WHERE public_profile.user_id = p.author_id
                             AND public_profile.privacy <> 'private')
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('${viewer}')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND ${cursor_predicate}
          ORDER BY p.created_at DESC, p.id DESC
          LIMIT 51;
          SQL
            done
          done

          psql -X -q -A -t -v ON_ERROR_STOP=1 > artifacts/notifications-first-page-baseline-plan.json <<'SQL'
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT n.id, n.type, n.post_id AS "postId",
                 n.created_at AS "createdAt", n.read_at AS "readAt",
                 p.handle, p.display_name AS "displayName"
          FROM notifications.notifications n
          LEFT JOIN social.profiles p ON p.user_id = n.actor_id
          WHERE n.recipient_id = md5('kukugram-bench-user-1')::uuid
          ORDER BY n.created_at DESC, n.id DESC
          LIMIT 51;
          SQL

          psql -X -q -A -t -v ON_ERROR_STOP=1 > artifacts/notifications-cursor-page-baseline-plan.json <<'SQL'
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT n.id, n.type, n.post_id AS "postId",
                 n.created_at AS "createdAt", n.read_at AS "readAt",
                 p.handle, p.display_name AS "displayName"
          FROM notifications.notifications n
          LEFT JOIN social.profiles p ON p.user_id = n.actor_id
          WHERE n.recipient_id = md5('kukugram-bench-user-1')::uuid
            AND (n.created_at, n.id) <
                (now() - interval '45 days', md5('kukugram-bench-notification-200000')::uuid)
          ORDER BY n.created_at DESC, n.id DESC
          LIMIT 51;
          SQL

      - name: Capture repeated baseline query measurements
        run: |
          set -euo pipefail
          mkdir -p artifacts/repeated/baseline
          capture_feed() {
            local cohort="$1" viewer="$2" page="$3" cursor_predicate="$4" output="$5"
            psql -X -q -A -t -v ON_ERROR_STOP=1 > "$output" <<SQL
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT p.id, p.body, p.created_at AS "createdAt",
                 pr.handle, pr.display_name AS "displayName",
                 pr.avatar_url AS "avatarUrl",
                 (SELECT count(*) FROM content.likes l WHERE l.post_id = p.id) AS "likeCount",
                 (SELECT count(*) FROM content.comments c WHERE c.post_id = p.id) AS "commentCount",
                 EXISTS(SELECT 1 FROM content.likes l WHERE l.post_id = p.id
                        AND l.user_id = md5('$viewer')::uuid) AS "likedByViewer",
                 p.author_id AS "authorId"
          FROM content.posts p JOIN social.profiles pr ON pr.user_id = p.author_id
          WHERE p.deleted_at IS NULL
            AND (p.author_id = md5('$viewer')::uuid OR EXISTS (
              SELECT 1 FROM social.follows f WHERE f.follower_id = md5('$viewer')::uuid
                AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND NOT EXISTS(SELECT 1 FROM social.mutes m
                           WHERE m.muter_id = md5('$viewer')::uuid AND m.muted_id = p.author_id)
            AND NOT EXISTS(SELECT 1 FROM social.blocks b
                           WHERE (b.blocker_id = p.author_id AND b.blocked_id = md5('$viewer')::uuid)
                              OR (b.blocker_id = md5('$viewer')::uuid AND b.blocked_id = p.author_id))
            AND (p.author_id = md5('$viewer')::uuid
                 OR EXISTS(SELECT 1 FROM social.profiles public_profile
                           WHERE public_profile.user_id = p.author_id AND public_profile.privacy <> 'private')
                 OR EXISTS(SELECT 1 FROM social.follows f
                           WHERE f.follower_id = md5('$viewer')::uuid
                             AND f.followee_id = p.author_id AND f.status = 'accepted'))
            AND $cursor_predicate
          ORDER BY p.created_at DESC, p.id DESC LIMIT 51;
          SQL
          }
          capture_notifications() {
            local page="$1" output="$2"
            local cursor_predicate="TRUE"
            if [[ "$page" == "cursor" ]]; then
              cursor_predicate="(n.created_at, n.id) < (now() - interval '45 days', md5('kukugram-bench-notification-200000')::uuid)"
            fi
            psql -X -q -A -t -v ON_ERROR_STOP=1 > "$output" <<SQL
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT n.id, n.type, n.post_id AS "postId", n.created_at AS "createdAt",
                 n.read_at AS "readAt", p.handle, p.display_name AS "displayName"
          FROM notifications.notifications n
          LEFT JOIN social.profiles p ON p.user_id = n.actor_id
          WHERE n.recipient_id = md5('kukugram-bench-user-1')::uuid
            AND $cursor_predicate
          ORDER BY n.created_at DESC, n.id DESC LIMIT 51;
          SQL
          }
          # Explicit warm-up pass; warm-up plans are excluded from measured summaries.
          mkdir -p artifacts/warmup/baseline
          for cohort in dense sparse high; do
            case "$cohort" in
              dense) viewer="kukugram-bench-user-1" ;;
              sparse) viewer="kukugram-bench-user-2" ;;
              high) viewer="kukugram-bench-user-3" ;;
            esac
            for page in first cursor; do
              predicate="TRUE"
              if [[ "$page" == "cursor" ]]; then
                predicate="(p.created_at, p.id) < (now() - interval '45 days', md5('kukugram-bench-post-200000')::uuid)"
              fi
              capture_feed "$cohort" "$viewer" "$page" "$predicate" "artifacts/warmup/baseline/feed-$cohort-$page.json"
            done
          done
          for page in first cursor; do
            capture_notifications "$page" "artifacts/warmup/baseline/notifications-$page.json"
          done
          for trial in {1..12}; do
            for cohort in dense sparse high; do
              case "$cohort" in
                dense) viewer="kukugram-bench-user-1" ;;
                sparse) viewer="kukugram-bench-user-2" ;;
                high) viewer="kukugram-bench-user-3" ;;
              esac
              for page in first cursor; do
                predicate="TRUE"
                if [[ "$page" == "cursor" ]]; then
                  predicate="(p.created_at, p.id) < (now() - interval '45 days', md5('kukugram-bench-post-200000')::uuid)"
                fi
                capture_feed "$cohort" "$viewer" "$page" "$predicate"                   "artifacts/repeated/baseline/feed-$cohort-$page-trial-$trial.json"
              done
            done
            for page in first cursor; do
              capture_notifications "$page"                 "artifacts/repeated/baseline/notifications-$page-trial-$trial.json"
            done
          done
          python3 - <<'PY'
          import csv, glob, json, math, os, statistics
          rows = []
          for path in sorted(glob.glob("artifacts/repeated/baseline/*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              plan = payload[0]["Plan"]
              timing = float(payload[0]["Execution Time"])
              rows.append({
                  "query": os.path.basename(path).rsplit("-trial-", 1)[0],
                  "trial": int(os.path.basename(path).rsplit("-trial-", 1)[1].split(".")[0]),
                  "execution_ms": timing,
                  "actual_rows": float(plan.get("Actual Rows", 0)),
                  "shared_hit_blocks": int(plan.get("Shared Hit Blocks", 0)),
                  "shared_read_blocks": int(plan.get("Shared Read Blocks", 0)),
              })
          with open("artifacts/repeated/baseline-summary.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          with open("artifacts/repeated/baseline-summary.txt", "w", encoding="utf-8") as handle:
              for name in sorted({row["query"] for row in rows}):
                  values = [row["execution_ms"] for row in rows if row["query"] == name]
                  cv = statistics.pstdev(values) / statistics.mean(values) * 100 if statistics.mean(values) else 0
                  group = [row for row in rows if row["query"] == name]
                  handle.write(f"{name}: n={len(values)} median_ms={statistics.median(values):.3f} min_ms={min(values):.3f} max_ms={max(values):.3f} stdev_ms={statistics.pstdev(values):.3f} cv_pct={cv:.2f} median_rows={statistics.median(r['actual_rows'] for r in group):.1f} median_shared_hits={statistics.median(r['shared_hit_blocks'] for r in group):.1f} median_shared_reads={statistics.median(r['shared_read_blocks'] for r in group):.1f}\n")
          PY
      - name: Prepare isolated write-overhead tables
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA benchmark;
          CREATE TABLE benchmark.posts_baseline (LIKE content.posts INCLUDING ALL);
          CREATE TABLE benchmark.posts_candidate (LIKE content.posts INCLUDING ALL);
          CREATE TABLE benchmark.notifications_baseline (LIKE notifications.notifications INCLUDING ALL);
          CREATE TABLE benchmark.notifications_candidate (LIKE notifications.notifications INCLUDING ALL);
          CREATE TABLE benchmark.notifications_replacement (LIKE notifications.notifications INCLUDING ALL);
          INSERT INTO benchmark.posts_baseline SELECT * FROM content.posts;
          INSERT INTO benchmark.posts_candidate SELECT * FROM content.posts;
          INSERT INTO benchmark.notifications_baseline SELECT * FROM notifications.notifications;
          INSERT INTO benchmark.notifications_candidate SELECT * FROM notifications.notifications;
          INSERT INTO benchmark.notifications_replacement SELECT * FROM notifications.notifications;
          DROP INDEX benchmark.notifications_replacement_recipient_id_created_at_idx;
          ANALYZE benchmark.notifications_replacement;
          ANALYZE benchmark.posts_baseline;
          ANALYZE benchmark.posts_candidate;
          ANALYZE benchmark.notifications_baseline;
          ANALYZE benchmark.notifications_candidate;
          SQL

      - name: Create disposable global cursor index candidate
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE INDEX posts_feed_global_cursor ON content.posts (created_at DESC, id DESC) INCLUDE (author_id) WHERE deleted_at IS NULL"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE INDEX notifications_recipient_cursor ON notifications.notifications (recipient_id, created_at DESC, id DESC)"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE INDEX bench_posts_global_cursor_candidate ON benchmark.posts_candidate (created_at DESC, id DESC) INCLUDE (author_id) WHERE deleted_at IS NULL"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE INDEX bench_notifications_recipient_cursor_candidate ON benchmark.notifications_candidate (recipient_id, created_at DESC, id DESC)"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE INDEX bench_notifications_replacement_cursor ON benchmark.notifications_replacement (recipient_id, created_at DESC, id DESC)"
          psql -X -v ON_ERROR_STOP=1 -c "ANALYZE benchmark.notifications_replacement"
          psql -X -v ON_ERROR_STOP=1 -c "ANALYZE content.posts"
          psql -X -v ON_ERROR_STOP=1 -c "ANALYZE notifications.notifications"
          psql -X -v ON_ERROR_STOP=1 -c "ANALYZE benchmark.posts_candidate"
          psql -X -v ON_ERROR_STOP=1 -c "ANALYZE benchmark.notifications_candidate"

      - name: Capture candidate-index query plans
        run: |
          set -euo pipefail
          mkdir -p artifacts
          psql -X -q -A -t -v ON_ERROR_STOP=1 > artifacts/feed-first-page-candidate-plan.json <<'SQL'
          SET jit = off;
          EXPLAIN (ANALYZE, BUFFERS, VERBOSE, FORMAT JSON)
          SELECT p.id, p.body, p.created_at AS "createdAt",
                 pr.handle, pr.display_name AS "displayName",
                 pr.avatar_url AS "avatarUrl",
