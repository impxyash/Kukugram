          python3 - <<'PY'
          import csv, glob, json, math, os, statistics
          rows = []
          for path in sorted(glob.glob("artifacts/repeated/candidate/*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              plan = payload[0]["Plan"]
              timing = float(payload[0]["Execution Time"])
              rows.append({
                  "query": os.path.basename(path).rsplit("-trial-", 1)[0],
                  "trial": int(os.path.basename(path).rsplit("-trial-", 1)[1].split(".")[0]),
                  "execution_ms": timing,
                  "actual_rows": float(plan.get("Actual Rows", 0)),
                  "shared_hit_blocks": int(plan.get("Shared Hit Blocks", 0)),
                  "shared_read_blocks": int(plan.get("Shared Read Blocks", 0)),
              })
          with open("artifacts/repeated/candidate-summary.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          with open("artifacts/repeated/candidate-summary.txt", "w", encoding="utf-8") as handle:
              for name in sorted({row["query"] for row in rows}):
                  values = [row["execution_ms"] for row in rows if row["query"] == name]
                  cv = statistics.pstdev(values) / statistics.mean(values) * 100 if statistics.mean(values) else 0
                  group = [row for row in rows if row["query"] == name]
                  handle.write(f"{name}: n={len(values)} median_ms={statistics.median(values):.3f} min_ms={min(values):.3f} max_ms={max(values):.3f} stdev_ms={statistics.pstdev(values):.3f} cv_pct={cv:.2f} median_rows={statistics.median(r['actual_rows'] for r in group):.1f} median_shared_hits={statistics.median(r['shared_hit_blocks'] for r in group):.1f} median_shared_reads={statistics.median(r['shared_read_blocks'] for r in group):.1f}\n")
          PY
