name: Playwright dependency bootstrap

on:
  push:
    branches: [feature/privacy-controls]

permissions:
  contents: write

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Resolve Playwright dependency with pnpm
        run: pnpm add --workspace-root --save-dev --lockfile-only @playwright/test@1.65.0
      - name: Commit pnpm-generated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm manifests already up to date"
            exit 0
          fi
          git commit -m "test(web): add Playwright test dependency"
          git push origin HEAD:feature/privacy-controls
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pnpm-manifests
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
