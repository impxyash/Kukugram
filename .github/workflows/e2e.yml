name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/privacy-controls]

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Playwright sources and commit
        if: github.event_name == 'push'
        run: |
          pnpm exec prettier --write playwright.config.ts apps/web/e2e/session.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright.config.ts apps/web/e2e/session.spec.ts
          if git diff --cached --quiet; then
            echo "Playwright sources already formatted"
            exit 0
          fi
          git commit -m "style(web): format Playwright browser tests"
          git push origin HEAD:feature/privacy-controls
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        run: pnpm exec playwright test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
