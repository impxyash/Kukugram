name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kukugram_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kukugram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kukugram_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export exact Prettier package for temporary formatting diagnosis
        run: |
          PRETTIER_PACKAGE="$(node -p "require.resolve('prettier/package.json')")"
          test "$(node -p "require(require.resolve('prettier/package.json')).version")" = "3.5.3"
          tar -czf /tmp/prettier-3.5.3.tgz -C "$(dirname "$PRETTIER_PACKAGE")" .
          cp packages/api-contract/src/schemas.test.ts /tmp/schemas.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-prettier-3.5.3-package
          path: |
            /tmp/prettier-3.5.3.tgz
            /tmp/schemas.test.ts
          if-no-files-found: error
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @kukugram/database build
      - run: pnpm test
      - run: pnpm build
