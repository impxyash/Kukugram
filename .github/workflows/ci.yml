name: CI

on:
  pull_request:
  push:
    branches: [main, feature/privacy-controls]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        continue-on-error: true # Existing repository formatting debt; keep typecheck/tests/build running
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @kukugram/database build
      - run: pnpm test
      - run: pnpm build
